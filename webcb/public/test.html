<script>
// Base del servizio: lo stesso host da cui e' servita la pagina (prod o stage).
// Aperta da file, punta alla produzione.
var WEBCB_BASE = /^https?:$/.test(location.protocol) ? location.origin : 'https://webcb.costacrociere.it';

// /rule sceglie la coda da controllare in base all'URL della pagina (parametro l):
// l'indirizzo di questa pagina non corrisponde a nessuna regola e darebbe sempre false,
// quindi si simula una pagina del portale. Un URL per ogni ramo di resultAction (ws.js).
var PAGINE_TEST = [
	{ nome: 'Italia',              coda: 'I_CBWB2C',    url: 'https://www.costacrociere.it/cruises.html' },
	{ nome: 'Francia',             coda: 'F_CBWB2C',    url: 'https://www.costacroisieres.fr/cruises.html' },
	{ nome: 'Spagna',              coda: 'E_CBWB2C',    url: 'https://www.costacruceros.es/cruceros.html' },
	{ nome: 'Regno Unito',         coda: 'GB_CBWB2C',   url: 'https://www.costacruises.co.uk/cruises.html' },
	{ nome: 'Svizzera FR',         coda: 'CH_F_CBWB2C', url: 'https://www.costakreuzfahrten.ch/fr/cruises.html' },
	{ nome: 'Svizzera DE',         coda: 'CH_D_CBWB2C', url: 'https://www.costakreuzfahrten.ch/de/cruises.html' },
	{ nome: 'Olanda',              coda: 'NL_CBWB2C',   url: 'https://www.costacruises.nl/cruises.html' },
	{ nome: 'Belgio',              coda: 'B_F_CBWB2C',  url: 'https://www.costacroisieres.be/cruises.html' },
	{ nome: 'Finlandia',           coda: 'SK_CBWB2C',   url: 'https://www.costacruises.fi/cruises.html' },
	{ nome: 'Europa (.eu)',        coda: 'NM_CBWB2C',   url: 'https://www.costacruises.eu/cruises.html' },
	{ nome: 'Germania',            coda: 'D_CBWB2C',    url: 'https://www.costakreuzfahrten.de/cruises.html' },
	{ nome: 'Austria',             coda: 'A_CBWB2C',    url: 'https://www.costakreuzfahrten.at/cruises.html' },
	{ nome: 'Argentina',           coda: 'ARG_CBWB2C',  url: 'https://www.costacruceros.com/cruceros.html' },
	{ nome: 'Argentina conferma',  coda: 'ARG_CBWOPT',  url: 'https://www.costacruceros.com/booking/confirmation.html' },
	{ nome: 'Brasile',             coda: 'BR_CBWB2C',   url: 'https://www.costacruzeiros.com/cruzeiros.html' },
	{ nome: 'Brasile conferma',    coda: 'BR_CBWOPT',   url: 'https://www.costacruzeiros.com/booking/confirmation.html' }
];

function async_load_ospe(url, coda) {
	var OSPE_SERVICE_URL = WEBCB_BASE + '/rule';
	OSPE_SERVICE_URL += '?l=' + encodeURIComponent(url);
	OSPE_SERVICE_URL += '&queue=' + encodeURIComponent(coda);
	OSPE_SERVICE_URL += '&tsoff='+(new Date().getTimezoneOffset());
	var s = document.createElement('script');
	s.type = 'text/javascript';
	s.src = OSPE_SERVICE_URL
	s.async = true;
	s.onerror = function () { logControllo('errore: /rule non ha risposto (URL non https o servizio non raggiungibile)'); };
	var j = document.getElementsByTagName('script') [0];
	j.parentNode.insertBefore(s, j);
};
</script>

<script>
function createCB(){
	fetch("https://webcb.costacrociere.it/callback", {
	  method: "POST",
	  body: document.getElementById("cb").value,
	  headers: {
		"Content-type": "application/json; charset=UTF-8"
	  }
	})
	.then(response => response.json())
	.then(result => {
	  document.getElementById("cbout").value=JSON.stringify(result);
	});
}
</script>

<h3>Test regole /rule (statistiche)</h3>
<label>Pagina simulata <select id="pagina" onchange="selezionaPagina()"></select></label><br>
<label>URL pagina (l) <input id="url" size="70"></label><br>
<label>Coda slot (queue) <input id="coda" size="15"></label>
<input type=button value="Verifica" onclick="verifica()">

<pre id="controlli">
Test sito

Controlli:</pre>
<script>
var cont=0;
function logControllo(testo){
	cont++;
	document.getElementById("controlli").textContent+="\n" + cont + " [" + new Date().toLocaleTimeString() + "] " + testo;
}
function $enableCallMeNow(callme){
	logControllo("$enableCallMeNow(" + callme + ")");
}
function $setAvailableSchedulingTime(slots){
	logControllo("$setAvailableSchedulingTime: " + slots.length + " slot disponibili");
}

function selezionaPagina(){
	var p = PAGINE_TEST[document.getElementById("pagina").selectedIndex];
	document.getElementById("url").value = p.url;
	document.getElementById("coda").value = p.coda;
}

// Ricarica la pagina con i nuovi parametri: cosi' si fermano anche i controlli
// periodici (ogni 60 s) avviati da /rule per l'URL precedente
function verifica(){
	location.search = '?l=' + encodeURIComponent(document.getElementById("url").value) +
		'&queue=' + encodeURIComponent(document.getElementById("coda").value);
}

window.addEventListener('load', function () {
	var select = document.getElementById("pagina");
	for (var i = 0; i < PAGINE_TEST.length; i++) {
		select.add(new Option(PAGINE_TEST[i].nome + " (" + PAGINE_TEST[i].coda + ")"));
	}
	var params = new URLSearchParams(location.search);
	var url = params.get('l');
	var coda = params.get('queue');
	if (!url) {
		selezionaPagina();
		url = document.getElementById("url").value;
		coda = document.getElementById("coda").value;
	} else {
		document.getElementById("url").value = url;
		document.getElementById("coda").value = coda || '';
		for (var k = 0; k < PAGINE_TEST.length; k++) {
			if (PAGINE_TEST[k].url === url) { select.selectedIndex = k; }
		}
	}
	var adesso = new Date();
	logControllo("pagina " + url + " - coda " + (coda || '-') + " - ora locale " +
		adesso.toLocaleTimeString() + " (minuto " + (adesso.getHours() * 60 + adesso.getMinutes()) + " del giorno)");
	async_load_ospe(url, coda || '');
}, false);
</script>
