
<script>
function async_load_ospe() {
	var OSPE_SERVICE_URL = 'https://webcb.costacrociere.it/rule';
	OSPE_SERVICE_URL += '?l=' + encodeURIComponent(window.location.href);
	OSPE_SERVICE_URL += '&queue=I_CBWB2C';
	OSPE_SERVICE_URL += '&tsoff='+(new Date().getTimezoneOffset());
	var s = document.createElement('script');
	s.type = 'text/javascript';
	s.src = OSPE_SERVICE_URL
	s.async = true;
	var j = document.getElementsByTagName('script') [0];
	j.parentNode.insertBefore(s, j);
};
if (window.attachEvent) {
	window.attachEvent('onload', async_load_ospe);
} else {
	window.addEventListener('load', async_load_ospe, false);
}


</script>

<script>
function createCB(){
	fetch("https://webcb.costacrociere.it/callback", {
	  method: "POST",
	  body: document.getElementById("cb").value,
	  headers: {
		"Content-type": "application/json; charset=UTF-8"
	  }
	})
	.then(response => response.json())
	.then(result => {
	  document.getElementById("cbout").value=JSON.stringify(result);
	});
}
</script>
